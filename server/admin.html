<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>{{SITE_NAME}} Leads</title>
<style>
  :root { --navy: #0b2e57; --accent: #1b7a9a; --line: #dfe6ee; --bg: #f3f6fa; --muted: #5d6b7c; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #17233a; background: var(--bg); }
  header { background: var(--navy); color: #fff; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; }
  header h1 { font-size: 18px; margin: 0; }
  button, input, select { font: inherit; }
  .btn { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 9px 16px; cursor: pointer; font-weight: 600; }
  .btn.ghost { background: transparent; border: 1px solid rgba(255,255,255,.5); }
  .btn.light { background: #fff; color: var(--navy); border: 1px solid var(--line); }
  .btn.danger { background: #fff; color: #b3261e; border: 1px solid #f0c9c6; padding: 5px 10px; font-size: 13px; }
  .btn:disabled { opacity: .5; cursor: default; }
  main { max-width: 1280px; margin: 24px auto; padding: 0 20px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 4px 14px rgba(11,46,87,.06); }
  .login { max-width: 380px; margin: 80px auto; padding: 32px; }
  .login h2 { margin: 0 0 18px; color: var(--navy); }
  .field { display: block; margin-bottom: 14px; font-weight: 600; font-size: 14px; }
  .field input { width: 100%; margin-top: 6px; padding: 10px 12px; border: 1.5px solid #c8d3e0; border-radius: 8px; font-weight: 400; }
  .err { color: #b3261e; font-size: 14px; min-height: 20px; margin-bottom: 8px; }
  .bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .bar input[type=search] { flex: 1 1 260px; padding: 9px 12px; border: 1.5px solid #c8d3e0; border-radius: 8px; }
  .bar input[type=date], .bar select { padding: 8px 10px; border: 1.5px solid #c8d3e0; border-radius: 8px; background: #fff; }
  .bar label { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 11px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { background: #f8fafc; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; position: sticky; top: 0; }
  tbody tr.row { cursor: pointer; }
  tbody tr.row:hover { background: #f5f9fd; }
  tr.detail td { background: #fafcff; white-space: normal; }
  dl { display: grid; grid-template-columns: 170px 1fr; gap: 6px 16px; margin: 0; }
  dt { color: var(--muted); font-weight: 600; }
  dd { margin: 0; word-break: break-word; }
  .foot { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; padding: 12px 16px; color: var(--muted); font-size: 14px; }
  .pager { display: flex; gap: 6px; align-items: center; }
  .empty { padding: 40px; text-align: center; color: var(--muted); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>{{SITE_NAME}} Leads</h1>
  <button class="btn ghost" id="logout" hidden>Log out</button>
</header>
<main>
  <section class="card login" id="login">
    <h2>Sign in</h2>
    <form id="loginForm">
      <label class="field">Username<input id="u" name="username" autocomplete="username" required /></label>
      <label class="field">Password<input id="p" name="password" type="password" autocomplete="current-password" required /></label>
      <div class="err" id="loginErr"></div>
      <button class="btn" type="submit" style="width:100%">Sign in</button>
    </form>
  </section>

  <section class="card" id="app" hidden>
    <div class="bar">
      <input type="search" id="q" placeholder="Search name, phone, email, zip, IP or token" />
      <label>From <input type="date" id="from" /></label>
      <label>To <input type="date" id="to" /></label>
      <button class="btn" id="go">Search</button>
      <button class="btn light" id="reset">Reset</button>
      <button class="btn light" id="csv">Export CSV</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>ID</th><th>Date</th><th>Name</th><th>Phone</th><th>Email</th><th>Age</th><th>Zip</th><th>IP</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="empty" id="empty" hidden>No leads found.</div>
    </div>
    <div class="foot">
      <span id="count"></span>
      <div class="pager">
        <label>Rows <select id="size"><option>10</option><option selected>25</option><option>50</option><option>100</option></select></label>
        <button class="btn light" id="first">&laquo;</button>
        <button class="btn light" id="prev">Prev</button>
        <span id="pageinfo"></span>
        <button class="btn light" id="next">Next</button>
        <button class="btn light" id="last">&raquo;</button>
      </div>
    </div>
  </section>
</main>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id) }
  var state = { page: 1, pages: 1 }

  function api(path, opts) {
    return fetch(path, Object.assign({ credentials: 'same-origin', headers: { 'Content-Type': 'application/json' } }, opts)).then(function (r) {
      if (r.status === 401 && path.indexOf('/login') < 0) { show(false); throw new Error('auth') }
      return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || 'Request failed'); return j })
    })
  }
  function show(authed) {
    $('login').hidden = authed; $('app').hidden = !authed; $('logout').hidden = !authed
  }
  function params() {
    var p = new URLSearchParams()
    if ($('q').value.trim()) p.set('q', $('q').value.trim())
    if ($('from').value) p.set('from', $('from').value)
    if ($('to').value) p.set('to', $('to').value)
    return p
  }
  function cell(tr, text) { var td = document.createElement('td'); td.textContent = text == null ? '' : text; tr.appendChild(td); return td }
  function fmtDate(v) { var d = new Date(v); return isNaN(d) ? String(v) : d.toLocaleString() }

  function detail(r) {
    var tr = document.createElement('tr'); tr.className = 'detail'
    var td = document.createElement('td'); td.colSpan = 8
    var dl = document.createElement('dl')
    ;[['Phone', r.phone], ['Email', r.email], ['Zip', r.zip], ['Age', r.age], ['Browser IP (ipify)', r.user_ip], ['Server IP', r.server_ip],
      ['LeadiD token', r.leadid_token], ['TrustedForm certificate', r.trustedform_url], ['Page', r.page_url], ['User agent', r.user_agent],
      ['Source', r.source], ['Consent text', r.consent_text]].forEach(function (kv) {
      var dt = document.createElement('dt'); dt.textContent = kv[0]
      var dd = document.createElement('dd'); dd.textContent = kv[1] == null || kv[1] === '' ? '-' : kv[1]
      dl.appendChild(dt); dl.appendChild(dd)
    })
    var del = document.createElement('button'); del.className = 'btn danger'; del.textContent = 'Delete lead'; del.style.marginTop = '12px'
    del.onclick = function () {
      if (!confirm('Delete lead #' + r.id + '? This cannot be undone.')) return
      api('/api/admin/leads/' + r.id, { method: 'DELETE' }).then(load)
    }
    td.appendChild(dl); td.appendChild(del); tr.appendChild(td)
    return tr
  }

  function load() {
    var p = params(); p.set('page', state.page); p.set('pageSize', $('size').value)
    api('/api/admin/leads?' + p.toString()).then(function (d) {
      state.page = d.page; state.pages = d.pages
      var body = $('rows'); body.innerHTML = ''
      d.rows.forEach(function (r) {
        var tr = document.createElement('tr'); tr.className = 'row'
        cell(tr, r.id); cell(tr, fmtDate(r.created_at)); cell(tr, r.first_name + ' ' + r.last_name); cell(tr, r.phone)
        cell(tr, r.email); cell(tr, r.age); cell(tr, r.zip); cell(tr, r.user_ip)
        var open = null
        tr.onclick = function () {
          if (open) { open.remove(); open = null; return }
          open = detail(r); tr.after(open)
        }
        body.appendChild(tr)
      })
      $('empty').hidden = d.rows.length > 0
      var from = d.total === 0 ? 0 : (d.page - 1) * d.pageSize + 1
      $('count').textContent = d.total === 0 ? '0 leads' : 'Showing ' + from + ' to ' + Math.min(d.total, d.page * d.pageSize) + ' of ' + d.total + ' leads'
      $('pageinfo').textContent = 'Page ' + d.page + ' of ' + d.pages
      $('first').disabled = $('prev').disabled = d.page <= 1
      $('next').disabled = $('last').disabled = d.page >= d.pages
    }).catch(function (e) { if (e.message !== 'auth') alert(e.message) })
  }

  $('loginForm').onsubmit = function (e) {
    e.preventDefault(); $('loginErr').textContent = ''
    api('/api/admin/login', { method: 'POST', body: JSON.stringify({ username: $('u').value, password: $('p').value }) })
      .then(function () { $('p').value = ''; show(true); load() })
      .catch(function (err) { $('loginErr').textContent = err.message })
  }
  $('logout').onclick = function () { api('/api/admin/logout', { method: 'POST' }).then(function () { show(false) }) }
  $('go').onclick = function () { state.page = 1; load() }
  $('q').onkeydown = function (e) { if (e.key === 'Enter') { state.page = 1; load() } }
  $('reset').onclick = function () { $('q').value = ''; $('from').value = ''; $('to').value = ''; state.page = 1; load() }
  $('size').onchange = function () { state.page = 1; load() }
  $('first').onclick = function () { state.page = 1; load() }
  $('prev').onclick = function () { state.page = Math.max(1, state.page - 1); load() }
  $('next').onclick = function () { state.page = Math.min(state.pages, state.page + 1); load() }
  $('last').onclick = function () { state.page = state.pages; load() }
  $('csv').onclick = function () { window.location = '/api/admin/leads.csv?' + params().toString() }

  api('/api/admin/session').then(function (s) { show(s.authed); if (s.authed) load() })
})()
</script>
</body>
</html>
